model: mghofnet
dataset: yrd
dataset_config: configs/datasets/yrd.yaml
output_root: runs_fewshot/fs5
device: cuda:0

patch_size: 11
hsi_channels: 10
aux_channels: 4
pad_mode: constant

emb_dim: 128
depth: 2
drop_path_rate: 0.2

split:
  method: fixed_train_counts
  train_counts: [5, 5, 5, 5, 5, 5, 5, 5]
batch_size: 128
test_batch_size: 1024
epochs: 200
num_runs: 5
seeds: [202201, 202202, 202203, 202204, 202205]
data_aug: true
learning_rate: 0.001
weight_decay: 0.01
eta_min: 0.000001

eval:
  enabled: true
  run_index: best
  batch_size: 1024
  save_labeled_maps: true

infer:
  batch_size: 512
  save_full_map: true

palette:
  background: [0, 0, 0]
  colors:
    - [62, 69, 191]
    - [224, 190, 82]
    - [158, 219, 74]
    - [77, 214, 83]
    - [63, 197, 153]
    - [174, 205, 45]
    - [181, 77, 218]
    - [255, 250, 0]
