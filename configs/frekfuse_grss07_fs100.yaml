model: frekfuse
dataset: grss07
dataset_config: configs/datasets/grss07.yaml
output_root: runs_fewshot/fs100
device: cuda:0
patch_size: 11
split:
  method: fixed_train_counts
  train_count_per_class: 100
use_validation: false
select_best_by: test
test_interval: 20
epochs: 200
num_runs: 5
seeds:
- 202201
- 202202
- 202203
- 202204
- 202205
eval:
  enabled: true
  run_index: best
  batch_size: 512
  save_labeled_maps: true
infer:
  batch_size: 512
  save_full_map: true
palette:
  background:
  - 0
  - 0
  - 0
  colors:
  - - 230
    - 25
    - 75
  - - 255
    - 225
    - 25
  - - 245
    - 130
    - 48
  - - 0
    - 130
    - 200
  - - 60
    - 180
    - 75
ms_channels: 6
sar_channels: 1
embed_dim: 128
spline_order: 2
dropout: 0.5
lite: true
batch_size: 64
learning_rate: 0.0005
weight_decay: 0.0001
eta_min: 1.0e-06
gradient_clip: 1.0
