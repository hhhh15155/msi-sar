model: fuzzy_transformer
dataset: grss07
dataset_config: configs/datasets/grss07.yaml
output_root: runs_fewshot/fs50
device: cuda:0
patch_size: 11
ms_channels: 6
sar_channels: 1
embed_dim: 192
num_heads: 6
depth_per_stage: 2
fusion_depth: 2
mlp_ratio: 4.0
dropout: 0.1
fusion: fuzzy
num_memberships: 7
membership_min_width: 0.15
fusion_temperature: 1.0
auxiliary_weight: 0.2
label_smoothing: 0.0
split:
  method: fixed_train_counts
  train_count_per_class: 50
batch_size: 128
test_batch_size: 128
epochs: 200
num_runs: 5
seeds:
- 202201
- 202202
- 202203
- 202204
- 202205
learning_rate: 0.0005
weight_decay: 0.0001
eta_min: 1.0e-06
gradient_clip: 1.0
eval:
  enabled: true
  run_index: 0
  batch_size: 128
  save_labeled_maps: true
infer:
  batch_size: 128
palette:
  background:
  - 0
  - 0
  - 0
  colors:
  - - 230
    - 25
    - 75
  - - 255
    - 225
    - 25
  - - 245
    - 130
    - 48
  - - 0
    - 130
    - 200
